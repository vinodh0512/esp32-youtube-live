<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Poll Controlled ESP32 Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --emerald: #10b981;
      --rose: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { padding: 0.25rem 0.75rem; borderRadius: 9999px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; border: 1px solid var(--border); }
    .badge-online { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border-color: rgba(16, 185, 129, 0.3); }
    .badge-offline { background: rgba(244, 63, 94, 0.15); color: var(--rose); border-color: rgba(244, 63, 94, 0.3); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .card-title { font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
    .card-value { font-size: 2.25rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
    .cmd-ON { color: var(--emerald); }
    .cmd-OFF { color: var(--rose); }
    .cmd-NONE { color: var(--text-muted); }
    .console-card { background: #090d16; border: 1px solid var(--border); border-radius: 1rem; padding: 1.25rem; font-family: monospace; font-size: 0.9rem; height: 260px; overflow-y: auto; color: #a7f3d0; }
    .console-line { margin-bottom: 0.4rem; word-break: break-all; }
    .btn-group { display: flex; gap: 0.75rem; }
    button { background: var(--primary); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button.btn-off { background: var(--rose); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ESP32 YouTube Live Poll Controller</h1>
      <div id="ws-badge" class="badge badge-offline">WebSocket Disconnected</div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="card-title">Latest ESP32 Command</div>
        <div id="cmd-display" class="card-value cmd-NONE">NONE</div>
        <div id="cmd-meta" style="font-size: 0.8rem; color: var(--text-muted);">Poll ID: N/A</div>
      </div>

      <div class="card">
        <div class="card-title">YouTube Stream Status</div>
        <div id="stream-status" class="card-value" style="font-size: 1.5rem; color: #fbbf24;">Checking...</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Auto-checks every 30s</div>
      </div>

      <div class="card">
        <div class="card-title">YouTube API Calls (Session)</div>
        <div id="api-calls" class="card-value" style="color: #60a5fa;">0</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Quota minimized</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Live Simulation Panel</div>
      <div class="btn-group">
        <button onclick="triggerSimulatedPoll('ON')">⚡ Test Poll: ON Wins (142 - 97)</button>
        <button class="btn-off" onclick="triggerSimulatedPoll('OFF')">🔴 Test Poll: OFF Wins (30 - 150)</button>
      </div>
    </div>

    <div>
      <div class="card-title" style="margin-bottom: 0.5rem;">Real-Time Event Stream</div>
      <div id="console" class="console-card">
        <div class="console-line">[System] Initializing dashboard interface...</div>
      </div>
    </div>
  </div>

  <script>
    const consoleDiv = document.getElementById('console');
    const cmdDisplay = document.getElementById('cmd-display');
    const cmdMeta = document.getElementById('cmd-meta');
    const streamStatus = document.getElementById('stream-status');
    const apiCalls = document.getElementById('api-calls');
    const wsBadge = document.getElementById('ws-badge');

    function logConsole(msg) {
      const line = document.createElement('div');
      line.className = 'console-line';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      consoleDiv.appendChild(line);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // Connect WebSocket
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
    let ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      wsBadge.className = 'badge badge-online';
      wsBadge.textContent = 'WebSocket Active';
      logConsole('Connected to backend WebSocket real-time push stream.');
    };

    ws.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        if (payload.event === 'command_update') {
          updateCommandUI(payload.data);
          logConsole(`[WS Event] Command updated -> ${payload.data.command} (Poll: ${payload.data.pollId})`);
        }
      } catch (err) {}
    };

    ws.onclose = () => {
      wsBadge.className = 'badge badge-offline';
      wsBadge.textContent = 'WebSocket Disconnected';
      logConsole('WebSocket disconnected. Retrying in 3s...');
      setTimeout(() => { window.location.reload(); }, 3000);
    };

    function updateCommandUI(data) {
      cmdDisplay.textContent = data.command;
      cmdDisplay.className = `card-value cmd-${data.command}`;
      cmdMeta.textContent = `Poll ID: ${data.pollId || 'N/A'} | Updated: ${new Date(data.timestamp).toLocaleTimeString()}`;
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        apiCalls.textContent = data.sessionApiRequests || 0;
        streamStatus.textContent = data.isLiveStreamActive ? '🟢 Stream Live' : '🟡 Checking Live';
        streamStatus.style.color = data.isLiveStreamActive ? '#10b981' : '#fbbf24';
        if (data.latestCommand) {
          updateCommandUI(data.latestCommand);
        }
      } catch (err) {}
    }

    async function triggerSimulatedPoll(winnerCommand) {
      const votes = winnerCommand === 'ON' ? { ON: 142, OFF: 97 } : { ON: 30, OFF: 150 };
      const pollId = `web-sim-${Date.now()}`;
      logConsole(`Triggering poll simulation (${winnerCommand} expected)...`);

      await fetch('/api/test/trigger-poll', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pollId: pollId,
          question: 'Control ESP32',
          options: ['ON', 'OFF'],
          votes: votes,
          isClosed: true
        })
      });

      fetchStats();
    }

    setInterval(fetchStats, 3000);
    fetchStats();
  </script>
</body>
</html>
